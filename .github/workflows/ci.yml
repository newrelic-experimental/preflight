name: CI

# Runs CONTRIBUTING.md's "Before opening a PR" checklist except one item:
# test:e2e, which needs a browser download and has a baseline only for macOS.
# Plus the web typecheck the checklist does not name, and the two drift-checker
# scripts that otherwise never run automatically: check-docs-inventory.ts
# (docs/code drift) and check-bundle-size.ts (SPA bundle budget, mirrors
# verify:plugin-hook's already-enforced pattern in release.yml).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The suite has an implicit, undocumented dependency on running under
  # America/New_York (several date/bucket tests construct fixtures from
  # local-midnight helpers without pinning TZ themselves) — it has only
  # ever been run on developer machines defaulting to that zone. GitHub
  # Actions runners default to UTC, which breaks those tests. Pin to the
  # zone the suite actually assumes rather than debugging each test's
  # local-time math; the individual tests remain non-portable and are a
  # separate follow-up.
  TZ: America/New_York

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Paired with Lint, which is how the pre-commit hook runs it
      # (`npm run lint && npm run format:check`), and cheap enough to fail
      # ahead of Build rather than after it.
      - name: Check formatting
        run: npm run format:check

      # The complete web project: tsconfig.web.json covers source and tests,
      # while `build:web` gates the release on tsconfig.web.build.json, which
      # excludes the tests. So this is the only check that reaches src/web's
      # test files — Vitest strips their types without checking them. Ahead of
      # Build so that the source errors the two configs share report under this
      # name instead of as "Build failed".
      - name: Typecheck (web)
        run: npx tsc -p tsconfig.web.json

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Test (web)
        run: npm run test:web

      - name: Check docs/code inventory drift
        run: npm run check:docs-inventory

      - name: Check SPA bundle size
        run: npm run check:bundle-size

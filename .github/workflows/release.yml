name: Release

# Triggered manually from the GitHub Actions UI, after the "Chore: Release x.y.z"
# PR that release-pr.yml opens has merged. That PR bumps the version in every
# file that carries it and adds the CHANGELOG entry; this releases what it
# merged.
# Creates a git tag, a GitHub release, and publishes to npm via
# npm Trusted Publishing (OIDC — no NPM_TOKEN secret required).
# Requires the Node.js Agent team to configure the OIDC connection
# on npmjs.com for @newrelic/preflight before first use.
on: [workflow_dispatch]

permissions:
  contents: write # to create git tag and GitHub release
  id-token: write # for npm trusted publishing OIDC exchange

jobs:
  publish:
    # Releases come from main only. Any other branch, including the release PR's own
    # changeset-release/main before it merges, would publish unreviewed commits.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # disable git hooks in CI

    steps:
      - uses: actions/checkout@v5

      - name: Setup git
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"

      - uses: actions/setup-node@v5
        with:
          # npm trusted publishing requires npm@11.5.1+, which ships with
          # Node.js v24.5.0+. Do not downgrade below Node 24.
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify plugin hook bundle is up to date
        run: npm run verify:plugin-hook

      # Checks that package-lock.json, server.json, and both plugin manifests
      # carry package.json's version, and that the newest CHANGELOG entry is
      # for it. Also fails while .changeset/ holds a changeset that releases
      # something, or one it can't read: the tag below goes on this checkout, so
      # its change would ship under a version whose entry leaves it out. main
      # only takes changes through a reviewed PR, so this job can't push a
      # fix-up commit. It can only fail loudly and point at the PR that needs
      # to land first, which is normally the release PR.
      - name: Verify version files are in sync
        run: npm run check:release-files

      # The release notes are the version's CHANGELOG entry, the text the release PR was
      # reviewed with, rather than a list of merged PR titles. Extracted before the tag is
      # pushed, so a CHANGELOG this can't read stops the run while there's nothing to undo.
      - name: Extract release notes
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PART=entry VERSION="$VERSION" awk -f scripts/changelog-entry.awk CHANGELOG.md \
            > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::CHANGELOG.md's first section isn't a dated entry for $VERSION with a body: a '## $VERSION - YYYY-MM-DD' heading, then the entry"
            exit 1
          fi

      # A tag that already exists must point at this commit. Otherwise this is a fresh run on a
      # main that has moved past a release whose publish failed, and the steps below would
      # publish the newer commit under the older tag's version. Re-run the original run's
      # failed jobs instead, which checks out the tagged commit. If that run fully succeeded,
      # there's nothing to release until the next release PR merges.
      - name: Create tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --quiet --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::$TAG already exists and points at $(git rev-parse --short "$TAG^{commit}"), not this commit ($(git rev-parse --short HEAD)). Check the run that created it: if it's still running, wait for it; if a step failed, re-run that run's failed jobs; if only the Homebrew tap step failed (the run is green with a warning on that step), use Re-run all jobs. Otherwise $VERSION is fully released, and this commit has nothing to release until the next release PR merges."
              exit 1
            fi
            echo "Tag $TAG already exists on origin at this commit, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@newrelic/preflight@$VERSION" version >/dev/null 2>&1; then
            echo "@newrelic/preflight@$VERSION already published, skipping"
            exit 0
          fi

          for attempt in 1 2 3; do
            if npm publish; then
              exit 0
            fi
            echo "npm publish attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          exit 1

      # The MCP Registry looks up the package on registry.npmjs.org to verify
      # it carries a matching `mcpName`, but npm's own registry API can take
      # several minutes to reflect a publish made via OIDC trusted publishing
      # (the provenance/attestation step adds latency on top of a normal
      # publish). A previous 150s retry budget (5 attempts, 10-50s backoff)
      # consistently failed here and only passed on a manual re-run minutes
      # later, once propagation had caught up. Poll for up to 10 minutes.
      # The tarball URL can lag the metadata that `npm view` reads, and the
      # Homebrew step hashes that tarball, so both have to resolve.
      - name: Wait for npm package availability
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TARBALL_URL="https://registry.npmjs.org/@newrelic/preflight/-/preflight-${VERSION}.tgz"
          for attempt in $(seq 1 20); do
            if npm view "@newrelic/preflight@$VERSION" version >/dev/null 2>&1 \
              && curl -fsI -o /dev/null "$TARBALL_URL"; then
              exit 0
            fi
            echo "@newrelic/preflight@$VERSION metadata or tarball not yet visible on npm, attempt $attempt"
            sleep 30
          done
          echo "@newrelic/preflight@$VERSION never became fully visible on npm (metadata and $TARBALL_URL)" >&2
          exit 1

      # homebrew/Formula/preflight.rb points at the npm tarball, so this must
      # run after the npm availability wait above — update-homebrew.sh curls
      # the tarball to hash it. This mutates the local checkout only, since
      # this job can't push to main (see the version check above). The tap
      # repo lives outside this job's default GITHUB_TOKEN scope, so it needs
      # the separately-scoped HOMEBREW_TAP_TOKEN — and that repo's own org-wide
      # ruleset requires a PR with one approving review on its default branch,
      # so this opens a PR and arms auto-merge rather than pushing to main
      # directly; a maintainer still needs to approve it once before it merges.
      # continue-on-error keeps a tap failure from blocking the MCP Registry
      # publish below; the next step reports the failure on the run summary.
      - name: Update Homebrew tap
        id: homebrew
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          scripts/update-homebrew.sh "$VERSION"

          # gh auth setup-git configures a credential helper backed by
          # GH_TOKEN, so the PAT never lands in the clone URL or on-disk
          # git config the way an embedded x-access-token URL would.
          gh auth setup-git
          TAP_DIR="$(mktemp -d)"
          git clone --depth 1 "https://github.com/newrelic-experimental/homebrew-preflight.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Formula"
          cp homebrew/Formula/preflight.rb "$TAP_DIR/Formula/preflight.rb"

          cd "$TAP_DIR"
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"

          # Stage before diffing: a plain `git diff` can't see a file that
          # doesn't exist in the tap yet (e.g. right after one-time setup),
          # so it would report "clean" and silently skip a real update.
          git add Formula/preflight.rb
          if git diff --cached --quiet; then
            echo "Tap formula already up to date for $VERSION, skipping"
            exit 0
          fi

          # BRANCH is deterministic per version so a re-run of this workflow
          # (e.g. after the npm-propagation retries above) converges on the
          # same tap PR instead of failing a non-fast-forward push or piling
          # up duplicate PRs.
          BRANCH="bump-${VERSION}"
          git checkout -b "$BRANCH"
          git commit -m "preflight $VERSION"
          git push --force origin "$BRANCH"

          EXISTING_PR="$(gh pr list --repo newrelic-experimental/homebrew-preflight --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$EXISTING_PR" ]; then
            gh pr create --repo newrelic-experimental/homebrew-preflight \
              --title "preflight $VERSION" \
              --body "Automated formula bump for the $VERSION release. Needs one approval before auto-merge lands it." \
              --base main --head "$BRANCH"
          fi
          gh pr merge "$BRANCH" --repo newrelic-experimental/homebrew-preflight --auto --squash \
            || echo "auto-merge not armed, approve and merge the tap PR by hand"

      # A continue-on-error step that fails leaves the run green, so without
      # this a missing tap PR is silent.
      - name: Report Homebrew tap failure
        if: steps.homebrew.outcome == 'failure'
        run: |
          MESSAGE="The Homebrew tap step failed, so no tap PR was opened for this release. Re-run all jobs once the cause is fixed."
          echo "::warning title=Homebrew tap not updated::$MESSAGE"
          echo "### Homebrew tap not updated" >> "$GITHUB_STEP_SUMMARY"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"

      # The MCP Registry (registry.modelcontextprotocol.io) verifies that the
      # npm package carries a matching `mcpName`, so this must run after the
      # npm publish above. GitHub OIDC auth covers the
      # io.github.newrelic-experimental/* namespace with no extra secret.
      # It submits the committed server.json, whose version the release PR
      # wrote and the version check above verified. Like the steps above, it
      # skips a version that's already there, so re-running a run (Re-run all
      # jobs, after a failed tap step) doesn't submit it twice.
      - name: Publish to MCP Registry
        run: |
          NAME="$(node -p "require('./server.json').name")"
          VERSION="$(node -p "require('./server.json').version")"
          ENCODED_NAME="$(node -p "encodeURIComponent(require('./server.json').name)")"
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/$ENCODED_NAME/versions/$VERSION")"
          if [ "$STATUS" = 200 ]; then
            echo "$NAME $VERSION is already in the MCP Registry, skipping"
            exit 0
          fi
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

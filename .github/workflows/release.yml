name: Release

# Triggered manually from the GitHub Actions UI.
# Creates a git tag, a GitHub release, and publishes to npm via
# npm Trusted Publishing (OIDC — no NPM_TOKEN secret required).
# Requires the Node.js Agent team to configure the OIDC connection
# on npmjs.com for @newrelic/preflight before first use.
on: [workflow_dispatch]

permissions:
  contents: write # to create git tag and GitHub release
  id-token: write # for npm trusted publishing OIDC exchange

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # disable git hooks in CI

    steps:
      - uses: actions/checkout@v5

      - name: Setup git
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"

      - uses: actions/setup-node@v5
        with:
          # npm trusted publishing requires npm@11.5.1+, which ships with
          # Node.js v24.5.0+. Do not downgrade below Node 24.
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify plugin hook bundle is up to date
        run: npm run verify:plugin-hook

      - name: Create tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" --generate-notes
          fi

      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@newrelic/preflight@$VERSION" version >/dev/null 2>&1; then
            echo "@newrelic/preflight@$VERSION already published, skipping"
            exit 0
          fi

          for attempt in 1 2 3; do
            if npm publish; then
              exit 0
            fi
            echo "npm publish attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          exit 1

      # The MCP Registry looks up the package on registry.npmjs.org to verify
      # it carries a matching `mcpName`, but npm's own registry API can take
      # a few seconds to reflect a publish that just succeeded. Poll for the
      # version instead of a fixed sleep, since propagation time varies.
      - name: Wait for npm package availability
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5; do
            if npm view "@newrelic/preflight@$VERSION" version >/dev/null 2>&1; then
              exit 0
            fi
            echo "@newrelic/preflight@$VERSION not yet visible on npm, attempt $attempt"
            sleep $((attempt * 10))
          done
          echo "@newrelic/preflight@$VERSION never became visible on npm" >&2
          exit 1

      # The MCP Registry (registry.modelcontextprotocol.io) verifies that the
      # npm package carries a matching `mcpName`, so this must run after the
      # npm publish above. GitHub OIDC auth covers the
      # io.github.newrelic-experimental/* namespace with no extra secret.
      - name: Sync server.json version
        run: |
          node -e "
            const fs = require('node:fs');
            const version = require('./package.json').version;
            const s = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            s.version = version;
            s.packages[0].version = version;
            fs.writeFileSync('server.json', JSON.stringify(s, null, 2) + '\n');
          "

      - name: Publish to MCP Registry
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

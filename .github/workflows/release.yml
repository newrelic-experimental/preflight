name: Release

# Triggered manually from the GitHub Actions UI, after the "Chore: Release x.y.z"
# PR that release-pr.yml opens has merged. That PR bumps the version in every
# file that carries it and adds the CHANGELOG entry; this releases what it
# merged.
# Creates a git tag, a GitHub release, and publishes to npm via
# npm Trusted Publishing (OIDC — no NPM_TOKEN secret required).
# Requires the Node.js Agent team to configure the OIDC connection
# on npmjs.com for @newrelic/preflight before first use.
on: [workflow_dispatch]

permissions:
  contents: write # to create git tag and GitHub release
  id-token: write # for npm trusted publishing OIDC exchange

jobs:
  publish:
    # Releases come from main only. Any other branch, including the release PR's own
    # changeset-release/main before it merges, would publish unreviewed commits.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # disable git hooks in CI

    steps:
      - uses: actions/checkout@v5

      - name: Setup git
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"

      - uses: actions/setup-node@v5
        with:
          # npm trusted publishing requires npm@11.5.1+, which ships with
          # Node.js v24.5.0+. Do not downgrade below Node 24.
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify plugin hook bundle is up to date
        run: npm run verify:plugin-hook

      # Checks that package-lock.json, server.json, and both plugin manifests
      # carry package.json's version, and that the newest CHANGELOG entry is
      # for it. Also fails while .changeset/ holds a changeset that releases
      # something: the tag below goes on this checkout, so its change would
      # ship under a version whose entry leaves it out. main only takes changes
      # through a reviewed PR, so this job can't push a fix-up commit. It can
      # only fail loudly and point at the PR that needs to land first, which
      # is normally the release PR.
      - name: Verify version files are in sync
        run: npm run check:release-files

      - name: Create tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" --generate-notes
          fi

      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@newrelic/preflight@$VERSION" version >/dev/null 2>&1; then
            echo "@newrelic/preflight@$VERSION already published, skipping"
            exit 0
          fi

          for attempt in 1 2 3; do
            if npm publish; then
              exit 0
            fi
            echo "npm publish attempt $attempt failed"
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          exit 1

      # The MCP Registry looks up the package on registry.npmjs.org to verify
      # it carries a matching `mcpName`, but npm's own registry API can take
      # several minutes to reflect a publish made via OIDC trusted publishing
      # (the provenance/attestation step adds latency on top of a normal
      # publish). A previous 150s retry budget (5 attempts, 10-50s backoff)
      # consistently failed here and only passed on a manual re-run minutes
      # later, once propagation had caught up. Poll for up to 10 minutes.
      - name: Wait for npm package availability
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 20); do
            if npm view "@newrelic/preflight@$VERSION" version >/dev/null 2>&1; then
              exit 0
            fi
            echo "@newrelic/preflight@$VERSION not yet visible on npm, attempt $attempt"
            sleep 30
          done
          echo "@newrelic/preflight@$VERSION never became visible on npm" >&2
          exit 1

      # homebrew/Formula/preflight.rb points at the npm tarball, so this must
      # run after the npm availability wait above — update-homebrew.sh curls
      # the tarball to hash it. This mutates the local checkout only, since
      # this job can't push to main (see the version check above). The tap
      # repo lives outside this job's default GITHUB_TOKEN scope, so it needs
      # the separately-scoped HOMEBREW_TAP_TOKEN — and that repo's own org-wide
      # ruleset requires a
      # PR with one approving review on its default branch, so this opens a
      # PR and arms auto-merge rather than pushing to main directly; a
      # maintainer still needs to approve it once before it merges.
      # continue-on-error keeps a tap failure from blocking the MCP Registry
      # publish below; the failure still shows as an annotation on the run.
      - name: Update Homebrew tap
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          scripts/update-homebrew.sh "$VERSION"

          # gh auth setup-git configures a credential helper backed by
          # GH_TOKEN, so the PAT never lands in the clone URL or on-disk
          # git config the way an embedded x-access-token URL would.
          gh auth setup-git
          TAP_DIR="$(mktemp -d)"
          git clone --depth 1 "https://github.com/newrelic-experimental/homebrew-preflight.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Formula"
          cp homebrew/Formula/preflight.rb "$TAP_DIR/Formula/preflight.rb"

          cd "$TAP_DIR"
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"

          # Stage before diffing: a plain `git diff` can't see a file that
          # doesn't exist in the tap yet (e.g. right after one-time setup),
          # so it would report "clean" and silently skip a real update.
          git add Formula/preflight.rb
          if git diff --cached --quiet; then
            echo "Tap formula already up to date for $VERSION, skipping"
            exit 0
          fi

          # BRANCH is deterministic per version so a re-run of this workflow
          # (e.g. after the npm-propagation retries above) converges on the
          # same tap PR instead of failing a non-fast-forward push or piling
          # up duplicate PRs.
          BRANCH="bump-${VERSION}"
          git checkout -b "$BRANCH"
          git commit -m "preflight $VERSION"
          git push --force origin "$BRANCH"

          EXISTING_PR="$(gh pr list --repo newrelic-experimental/homebrew-preflight --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$EXISTING_PR" ]; then
            gh pr create --repo newrelic-experimental/homebrew-preflight \
              --title "preflight $VERSION" \
              --body "Automated formula bump for the $VERSION release. Needs one approval before auto-merge lands it." \
              --base main --head "$BRANCH"
          fi
          gh pr merge "$BRANCH" --repo newrelic-experimental/homebrew-preflight --auto --squash \
            || echo "auto-merge not armed, approve and merge the tap PR by hand"

      # The MCP Registry (registry.modelcontextprotocol.io) verifies that the
      # npm package carries a matching `mcpName`, so this must run after the
      # npm publish above. GitHub OIDC auth covers the
      # io.github.newrelic-experimental/* namespace with no extra secret.
      # It submits the committed server.json, whose version the release PR
      # wrote and the version check above verified.
      - name: Publish to MCP Registry
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
